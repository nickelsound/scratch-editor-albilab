version: '3.8'

services:
  # Scratch GUI aplikace (používá universal image s APP_MODE=frontend)
  scratch-gui:
    build:
      context: .
      dockerfile: Dockerfile.universal
      platforms:
        - linux/amd64
        - linux/arm64
    image: scratch-universal:latest
    container_name: scratch-gui-app
    ports:
      - "8601:8601"
    environment:
      - NODE_ENV=production
      - APP_MODE=frontend
      - PORT=8601
      # Runtime konfigurace backend URL (volitelné - pokud není nastaveno, použije se default localhost:3001)
      # Pro reverzní proxy nastavte na URL reverzní proxy, např.:
      # - REACT_APP_API_BASE_URL=http://reverse-proxy.example.com/api
      # - REACT_APP_WS_BASE_URL=ws://reverse-proxy.example.com/api
      # Pro testování můžete použít environment proměnné z .env souboru nebo přímo zde:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-}
      - REACT_APP_WS_BASE_URL=${REACT_APP_WS_BASE_URL:-}
      # The frontend proxy reaches the backend over the Compose network.
      - BACKEND_PROXY_BASE_URL=http://scratch-backend-app:3001
      - PI_CAMERA_PROXY_BASE_URL=http://pi-camera-service:8088
      # Showroom mode: set DISABLE_BACKGROUND_PROJECTS=true to hide/deactivate persistent project execution.
      - REACT_APP_DISABLE_BACKGROUND_PROJECTS=${DISABLE_BACKGROUND_PROJECTS:-false}
    restart: always
    depends_on:
      - pi-camera-service
      - scratch-backend-app

  # CSI camera access is isolated to this Podman container.
  pi-camera-service:
    build:
      context: ./packages/pi-camera-service
    image: scratch-pi-camera:latest
    container_name: scratch-pi-camera
    platform: linux/arm64
    privileged: true
    volumes:
      - /run/udev:/run/udev:ro
    tmpfs:
      - /dev/shm:exec
    restart: always

  # Backend server pro trvalý běh projektů (používá universal image s APP_MODE=backend)
  scratch-backend-app:
    build:
      context: .
      dockerfile: Dockerfile.universal
      platforms:
        - linux/amd64
        - linux/arm64
    image: scratch-universal:latest
    container_name: scratch-backend-app
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - APP_MODE=backend
      - PORT=3001
      # Showroom mode: set DISABLE_BACKGROUND_PROJECTS=true to block deploy/start APIs and clear running projects.
      - DISABLE_BACKGROUND_PROJECTS=${DISABLE_BACKGROUND_PROJECTS:-false}
      - PI_CAMERA_SERVICE_URL=http://pi-camera-service:8088
      - FLOWER_API_BASE_URL=${FLOWER_API_BASE_URL:?Set FLOWER_API_BASE_URL in .env}
    volumes:
      - ./uploads:/app/uploads
    restart: always
    depends_on:
      - pi-camera-service
